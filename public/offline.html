<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E60000">
  <title>Offline | Korean Fried Chicken</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F5F0E1;
      color: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 16px;
      text-align: center;
    }
    header {
      padding: 16px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-container {
      width: 48px;
      height: 48px;
      background: #FFFFFF;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(0, 0, 0, 0.1);
      padding: 4px;
    }
    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .brand-text {
      text-align: left;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 900;
      color: #E60000;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: block;
    }
    .brand-subtitle {
      font-size: 9px;
      color: #B48600;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: block;
    }
    main {
      max-width: 420px;
      width: 100%;
      background: #FAF7F0;
      border: 1px solid #e5e5e5;
      border-radius: 20px;
      padding: 36px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.06);
      position: relative;
      overflow: hidden;
    }
    .accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: #FCD814;
    }
    .offline-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(230, 0, 0, 0.1);
      border: 1px solid rgba(230, 0, 0, 0.2);
      color: #E60000;
      font-size: 11px;
      font-weight: 700;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
      color: #000000;
      margin-bottom: 12px;
      line-height: 1.2;
    }
    p {
      font-size: 14px;
      color: #4C3D32;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .retry-btn {
      background-color: #E60000;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(230, 0, 0, 0.3);
      transition: transform 0.15s ease, background-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .retry-btn:hover {
      background-color: #cc0000;
      transform: translateY(-1px);
    }
    .retry-btn:active {
      transform: translateY(1px);
    }
    footer {
      font-size: 11px;
      color: #999999;
      font-weight: 600;
      padding: 16px 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="/logo.png" alt="Logo">
    </div>
    <div class="brand-text">
      <span class="brand-title">Korean Fried Chicken</span>
      <span class="brand-subtitle">Premium Fried Chicken & Beverages</span>
    </div>
  </header>

  <main>
    <div class="accent-bar"></div>
    <span class="offline-badge">No Connection</span>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Some features require internet access to sync data.</p>
    <button class="retry-btn" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Retry Connection
    </button>
  </main>

  <footer>
    Korean Fried Chicken • Offline Mode
  </footer>
</body>
</html>
